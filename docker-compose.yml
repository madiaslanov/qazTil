services:
  qaztil:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /app/data/qaztil.db
    volumes:
      - qaztil-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  qaztil-data:
