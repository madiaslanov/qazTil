services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qaztil
      POSTGRES_PASSWORD: qaztil
      POSTGRES_DB: qaztil
    ports:
      - "5432:5432"
    volumes:
      - qaztil-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaztil -d qaztil"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qaztil:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://qaztil:qaztil@postgres:5432/qaztil?sslmode=disable
      JWT_SECRET: dev-secret-change-me-0123456789abcdef
      ALLOWED_ORIGINS: http://localhost:3000,https://qaz-til.vercel.app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  qaztil-pg:
