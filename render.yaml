databases:
  - name: qaztil-db
    databaseName: qaztil
    user: qaztil
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: qaztil
    runtime: go
    rootDir: backend
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qaztil-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://qaz-til.vercel.app,http://localhost:3000
      - key: JWT_SECRET
        generateValue: true
