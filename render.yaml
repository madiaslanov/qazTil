services:
  - type: web
    name: qaztil
    runtime: go
    rootDir: backend
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./cmd/api
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: DB_PATH
        value: /var/data/qaztil.db
    disk:
      name: qaztil-data
      mountPath: /var/data
      sizeGB: 1
