name: CI

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qaztil
          POSTGRES_PASSWORD: qaztil
          POSTGRES_DB: qaztil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qaztil -d qaztil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://qaztil:qaztil@localhost:5432/qaztil?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l main.go internal)"
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Build
        working-directory: backend
        run: go build -tags netgo -ldflags '-s -w' -o app .
